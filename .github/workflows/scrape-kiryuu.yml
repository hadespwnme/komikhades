name: Scrape Kiryuu

on:
  # Run daily at 06:30 UTC (13:30 WIB), 30 minutes after the komiku scrape
  schedule:
    - cron: "30 6 * * *"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      url:
        description: "Kiryuu manga URL"
        required: false
        default: "https://v7.kiryuu.to/manga/detective-conan/"
      force_pages:
        description: "Re-scrape all chapter pages? (true/false)"
        required: false
        default: "false"

# Never run two Kiryuu scrapes at the same time (they would race on git push).
concurrency:
  group: scrape-kiryuu
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run Kiryuu scraper
        run: |
          URL="${{ github.event.inputs.url || 'https://v7.kiryuu.to/manga/detective-conan/' }}"
          FORCE="${{ github.event.inputs.force_pages || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            python scraper/scrape_kiryuu.py --url "$URL" --force-pages
          else
            python scraper/scrape_kiryuu.py --url "$URL"
          fi

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain public/data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "chore: update kiryuu data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Trigger Vercel redeployment (optional)
        if: steps.changes.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -X POST "$VERCEL_DEPLOY_HOOK"
