name: Scrape Comics

on:
  # Run daily at 06:00 UTC (13:00 WIB)
  schedule:
    - cron: "0 6 * * *"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      comics:
        description: "Comma-separated comic slugs to scrape (default: gosu)"
        required: false
        default: "gosu"
      scrape_pages:
        description: "Scrape chapter page images? (true/false)"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper — all komiku comics
        run: |
          # Get all komiku comic slugs from comics.json (exclude kiryuu source)
          KOMIKU_SLUGS=$(python -c "
          import json
          d = json.load(open('public/data/comics.json'))
          slugs = [c['slug'] for c in d if c.get('source','komiku') != 'kiryuu']
          print(','.join(slugs))
          ")
          echo "Scraping $KOMIKU_SLUGS"
          python scraper/scrape.py --comics "$KOMIKU_SLUGS" --no-pages

      - name: Run scraper — all kiryuu comics
        run: |
          KIRYUU_SLUGS=$(python -c "
          import json
          d = json.load(open('public/data/comics.json'))
          slugs = [c['slug'] for c in d if c.get('source','kiryuu') == 'kiryuu']
          print(','.join(slugs))
          ")
          if [ -n "$KIRYUU_SLUGS" ]; then
            echo "Scraping kiryuu: $KIRYUU_SLUGS"
            python scraper/scrape_kiryuu.py --comics "$KIRYUU_SLUGS"
          fi

      - name: Scrape Popular Today (auto-scrape missing comics)
        run: python scraper/scrape_popular.py

        # Store image URLs in public/data/ so the reader does not depend on
        # fetching komiku.org at request time (blocked from Vercel).
        # Resume-safe: chapters that already have pages are skipped.

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "chore: update comic data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Trigger Vercel redeployment (optional)
        if: steps.changes.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -X POST "$VERCEL_DEPLOY_HOOK"
